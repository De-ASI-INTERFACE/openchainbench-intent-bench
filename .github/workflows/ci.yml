name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check go.mod exists
        run: |
          if [ ! -f go.mod ]; then
            echo "go.mod not found"
            exit 1
          fi
          echo "✓ go.mod exists"

      - name: Check harness source exists
        run: |
          if [ ! -f harnesses/intent-solver-latency/main.go ]; then
            echo "Harness source not found"
            exit 1
          fi
          echo "✓ Harness source exists"
